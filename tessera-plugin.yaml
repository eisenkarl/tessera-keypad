# Keypad: a keypad on the screen. Each code switches its own entity in Home Assistant (up to eight pairs).
id: code_lock
version: 0.8.1
api: "0.26"
icon: lock
maintainer: mifricke
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 12

permissions:
  home_assistant_actions: [lock.unlock, cover.open_cover, switch.toggle, input_boolean.toggle, light.toggle,
                           script.turn_on, scene.turn_on, button.press,
                           lock.lock, cover.close_cover, switch.turn_off, input_boolean.turn_off, light.turn_off]

tiles:
  - id: keypad
    name: tile_name
    icon: lock
    sizes: { min: 1x1, max: 9x9 }
    memory: 500
    example: tile_example
    options:
      # Pair 1 (required): entity + code. Optional helper overrides the first code.
      - { id: target, kind: entity, domains: [lock, cover, switch, input_boolean, light, script, scene, button],
          label: target, hint: target_hint }
      - { id: code, kind: text, label: code, hint: code_hint }
      - { id: code_entity, kind: entity, domains: [input_text, text], label: code_entity, hint: code_entity_hint }
      # Further pairs: each code switches its own entity.
      - { id: target_2, kind: entity, domains: [lock, cover, switch, input_boolean, light, script, scene, button],
          label: target_2, hint: target_n_hint }
      - { id: code_2, kind: text, label: code_2, hint: code_n_hint }
      - { id: target_3, kind: entity, domains: [lock, cover, switch, input_boolean, light, script, scene, button],
          label: target_3, hint: target_n_hint }
      - { id: code_3, kind: text, label: code_3, hint: code_n_hint }
      - { id: target_4, kind: entity, domains: [lock, cover, switch, input_boolean, light, script, scene, button],
          label: target_4, hint: target_n_hint }
      - { id: code_4, kind: text, label: code_4, hint: code_n_hint }
      - { id: target_5, kind: entity, domains: [lock, cover, switch, input_boolean, light, script, scene, button],
          label: target_5, hint: target_n_hint }
      - { id: code_5, kind: text, label: code_5, hint: code_n_hint }
      - { id: target_6, kind: entity, domains: [lock, cover, switch, input_boolean, light, script, scene, button],
          label: target_6, hint: target_n_hint }
      - { id: code_6, kind: text, label: code_6, hint: code_n_hint }
      - { id: target_7, kind: entity, domains: [lock, cover, switch, input_boolean, light, script, scene, button],
          label: target_7, hint: target_n_hint }
      - { id: code_7, kind: text, label: code_7, hint: code_n_hint }
      - { id: target_8, kind: entity, domains: [lock, cover, switch, input_boolean, light, script, scene, button],
          label: target_8, hint: target_n_hint }
      - { id: code_8, kind: text, label: code_8, hint: code_n_hint }
      - { id: free_close, kind: toggle, label: free_close, hint: free_close_hint, default: false }
      - { id: auto_check, kind: toggle, label: auto_check, hint: auto_check_hint, default: true }
      - { id: attempts, kind: number, label: attempts, hint: attempts_hint, min: 1, max: 10, default: 3 }
      - { id: wait, kind: number, label: wait, hint: wait_hint, min: 5, max: 600, step: 5, unit: s, default: 30 }

cards:
  - { id: keys, name: card_name }
